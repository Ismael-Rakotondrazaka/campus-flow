name: Deploy Campus Flow

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Get code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Login to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Build and push app image
      - name: Build and Push App
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NUXT_PUBLIC_APP_URL=${{ vars.NUXT_PUBLIC_APP_URL }}
            NUXT_PUBLIC_APP_VERSION=${{ vars.NUXT_PUBLIC_APP_VERSION }}
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL }}
          tags: |
            ghcr.io/ismael-rakotondrazaka/campus-flow:latest
            ghcr.io/ismael-rakotondrazaka/campus-flow:${{ github.sha }}

      # 4. Build and push setup image
      - name: Build and Push Setup
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.setup
          push: true
          tags: |
            ghcr.io/ismael-rakotondrazaka/campus-flow:setup

      # 5. Deploy on VPS
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            cd ~/projects/campus-flow

            docker compose pull

            docker compose up -d --remove-orphans
